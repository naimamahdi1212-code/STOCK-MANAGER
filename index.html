<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Management System </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header class="app-header">
      <div class="header-top">
        <h1>Stock Inventory</h1>
        <p class="tagline">Know what's on the shelf, and what it's worth.</p>
      </div>
      <div class="summary-cards">
        <div class="summary-card">
          <span class="summary-label">Items in stock</span>
          <span class="summary-value" id="itemCount">0</span>
        </div>
        <div class="summary-card highlight">
          <span class="summary-label">Total inventory value</span>
          <span class="summary-value" id="totalValue">KSh 0</span>
        </div>
      </div>
    </header>

    <section class="entry-form-section">
      <h2 class="form-heading">Add / Update Stock</h2>
      <form id="entryForm">
        <input type="hidden" id="editingId" value="">

        <div class="field-row">
          <div class="field">
            <label for="itemName">Item name</label>
            <input type="text" id="itemName" name="itemName" placeholder="e.g. Cooking oil 1L" required>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Choose one</option>
              <option value="Groceries">Groceries</option>
              <option value="Household">Household</option>
               <option value="Household">Foodstuffs</option>
                <option value="Household">Pasteries</option>
                 <option value="Household">Refreshments</option>
              <option value="Electricals">Electricals</option>
              <option value="Building Materials">Building Materials</option>
              <option value="Stationery">Stationery</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field field-small">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" placeholder="0" min="0" step="1" required>
          </div>
          <div class="field field-small">
            <label for="price">Unit price (KSh)</label>
            <input type="number" id="price" name="price" placeholder="0" min="0" step="1" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn-primary">Add item</button>
          <button type="button" id="cancelEditBtn" class="btn-text" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="entries-section">
      <div class="entries-heading">
        <span>Item</span>
        <span>Category</span>
        <span class="align-right">Qty</span>
        <span class="align-right">Unit price</span>
        <span class="align-right">Value</span>
        <span class="align-right">Actions</span>
      </div>

      <div id="entriesList" class="entries-list">
        <!-- Rows are rendered here by app.js -->
      </div>

      <p id="emptyState" class="empty-state" hidden>
        No stock recorded yet. Add your first item above.
      </p>
    </section>

    <footer class="page-footer">
      <p>Stock is stored in Supabase — data persists across refreshes and devices.</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
